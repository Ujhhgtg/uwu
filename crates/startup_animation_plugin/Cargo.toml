[package]
name = "startup_animation_plugin"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["dylib"]

[dependencies]
plugin_api = { path = "../plugin_api" }
egui = { version = "0.34", default-features = false }
rodio = { version = "0.22", default-features = false, features = [
    "wav",
    "playback",
] }
image = { version = "0.25", default-features = false, features = ["png"] }
